<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoreTrace | Cadastrar Funcionário</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/cadastro-funcionario.css">
</head>

<body class="employee-page">
    <aside class="employee-sidebar">
        <a class="employee-logo" href="/" aria-label="Ir para a página inicial">
            <img src="../assets/icons/Simple-Logo.png" alt="CoreTrace">
        </a>

        <nav class="sidebar-navigation" >
            <a class="sidebar-link active" href="#">Cadastrar Funcionário</a>
            <a class="sidebar-link" href="#">Ver Funcionários</a>
        </nav>
    </aside>

    <div class="employee-shell">
        <header class="navbar employee-navbar">
            <div class="logged-user">
                <strong id="loggedUserName">Username_example_admin</strong>
                <span id="loggedUserEmail">useremail@admin.com</span>
            </div>

            <nav class="navbar-right" aria-label="Navegação da conta">
                <a href="#" class="nav-link">Dashboard</a>
                <a href="/pages/login.html" class="nav-link" id="logoutLink">Sair</a>
            </nav>
        </header>

        <main class="employee-content">
            <section class="employee-card" aria-labelledby="register-title">
                <h1 id="register-title">Cadastro de Novo Funcionário</h1>

                <div class="steps employee-steps" aria-label="Etapa do cadastro">
                    <div class="dot active" id="firstDot"></div>
                    <div class="step-line" id="stepLine"></div>
                    <div class="dot inactive" id="secondDot"></div>
                </div>

                <form id="employeeForm">
                    <div class="form-step active" id="firstStep">
                        <label class="visually-hidden" for="employeeName">Nome</label>
                        <input class="input" id="employeeName" name="name" type="text" placeholder="Nome" required>

                        <label class="visually-hidden" for="employeeEmail">Email</label>
                        <input class="input" id="employeeEmail" name="email" type="email" placeholder="Email" required>

                        <label class="visually-hidden" for="employeePassword">Senha</label>
                        <input class="input" id="employeePassword" name="password" type="password" placeholder="Senha" minlength="6" required>

                        <label class="visually-hidden" for="employeeRole">Cargo</label>
                        <select class="input employee-select" id="employeeRole" name="role" required>
                            <option value="" selected disabled>Cargo</option>
                            <option value="2">Analista de Dados</option>
                        </select>

                        <div class="employee-action">
                            <button class="btn-next" id="nextButton" type="button">Próximo</button>
                        </div>
                    </div>

                    <div class="form-step" id="secondStep">
                        <fieldset class="access-group">
                            <legend>Informe os setores que o usuário terá acesso</legend>
                            <div class="selection-box">
                                <span class="selection-title">Setores</span>
                                <label><input class="sector-checkbox" type="checkbox" name="sectors" value="vendas"> Vendas</label>
                                <label><input class="sector-checkbox" type="checkbox" name="sectors" value="financeiro"> Financeiro</label>
                                <label><input class="sector-checkbox" type="checkbox" name="sectors" value="loja"> Loja</label>
                            </div>
                            <label class="select-all">
                                Selecionar Tudo
                                <input id="selectAllSectors" type="checkbox">
                            </label>
                        </fieldset>

                        <fieldset class="access-group">
                            <legend>Informe as máquinas que o usuário terá acesso</legend>
                            <div class="selection-box machines-box">
                                <span class="selection-title">Máquinas</span>
                                <!-- TODO: Pegar pcs do bd -->
                                <label><span><input class="machine-checkbox" type="checkbox" name="machines" value="UMCumc#2026"> UMCumc#2026</span><span>Vendas</span></label>
                                <label><span><input class="machine-checkbox" type="checkbox" name="machines" value="maquina2"> maquina2</span><span>Vendas</span></label>
                                <label><span><input class="machine-checkbox" type="checkbox" name="machines" value="maquina3"> maquina3</span><span>Vendas</span></label>
                                <label><span><input class="machine-checkbox" type="checkbox" name="machines" value="maquina7"> maquina7</span><span>Loja</span></label>
                                <label><span><input class="machine-checkbox" type="checkbox" name="machines" value="maquina8"> maquina8</span><span>Loja</span></label>
                            </div>
                            <label class="select-all">
                                Selecionar Tudo
                                <input id="selectAllMachines" type="checkbox">
                            </label>
                        </fieldset>

                        <label class="terms-confirmation">
                            <input id="termsCheckbox" type="checkbox" required>
                            <span>Desejo Cadastrar esse Funcionário <a href="#">Termos de Serviço</a></span>
                        </label>

                        <p class="form-feedback" id="formFeedback" role="status" aria-live="polite"></p>

                        <div class="employee-action">
                            <button class="btn-next" type="submit">Finalizar</button>
                            <img class="loading-indicator" id="registerLoading" src="../assets/images/loading.gif" alt="Cadastrando funcionário" hidden>
                        </div>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <script src="../scripts/api.js"></script>
    <script src="../scripts/cadastro-funcionario.js"></script>
</body>

</html>
