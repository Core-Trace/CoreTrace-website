<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoreTrace | Cadastrar Funcionário</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/cadastro-funcionario.css">
    <link rel="stylesheet" href="../css/aside-dash.css">
</head>

<body class="employee-page">
    <aside class="employee-sidebar">
        <a class="employee-logo" href="/" aria-label="Ir para a página inicial">
            <img src="../assets/images/CoreTraceLetteringDarkMode.avif" alt="CoreTrace">
        </a>

        <nav class="sidebar-navigation">
            <a class="sidebar-link active" href="#">Cadastrar Funcionário</a>
            <a class="sidebar-link " href="general-employee.html">Ver Funcionários</a>

            <div class="sidebar-submenu">
                <div class="sidebar-group">
                    <div class="sidebar-group-title">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                        Setor
                    </div>
                    <div class="sidebar-group-content">
                        <div class="sidebar-group">
                            <div class="sidebar-group-title">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="6 9 12 15 18 9"></polyline>
                                </svg>
                                Servidor
                            </div>
                            <div class="sidebar-group-content">
                                <!-- <a href="#" class="sidebar-sub-link">
                                        <span style="display:inline-block; width: 12px; margin-left: -12px;">&bull;</span>UMCumc#2026
                                    </a> -->
                                <a href="dashboard.html?machinemaquina2" class="sidebar-sub-link">maquina2</a>
                                <a href="dashboard.html?machine=maquina3" class="sidebar-sub-link">maquina3</a>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="sidebar-submenu">
        </nav>
    </aside>

    <div class="employee-shell">
        <header class="navbar employee-navbar">
            <div class="logged-user">
                <strong id="loggedUserName">Username_example_admin</strong>
                <span id="loggedUserEmail">useremail@admin.com</span>
            </div>

            <nav class="navbar-right" aria-label="Navegação da conta">
                <a href="#" class="nav-link">Dashboard</a>
                <a href="/pages/login.html" class="nav-link" id="logoutLink">Sair</a>
            </nav>
        </header>

        <main class="employee-content">
            <section class="employee-card" aria-labelledby="register-title">
                <h1 id="register-title">Cadastro de Novo Funcionário</h1>

                <div class="steps employee-steps" aria-label="Etapa do cadastro">
                    <div class="dot active" id="firstDot"></div>
                    <div class="step-line" id="stepLine"></div>
                    <div class="dot inactive" id="secondDot"></div>
                </div>

                <form id="employeeForm">
                    <div class="form-step active" id="firstStep">
                        <label class="visually-hidden" for="employeeName">Nome</label>
                        <input class="input" id="employeeName" name="name" type="text" placeholder="Nome" required>

                        <label class="visually-hidden" for="employeeEmail">Email</label>
                        <input class="input" id="employeeEmail" name="email" type="email" placeholder="Email" required>

                        <label class="visually-hidden" for="employeePassword">Senha</label>
                        <input class="input" id="employeePassword" name="password" type="password" placeholder="Senha"
                            minlength="6" required>

                        <label class="visually-hidden" for="employeeRole">Cargo</label>
                        <select class="input employee-select" id="employeeRole" name="role" required>
                            <option value="" selected disabled>Cargo</option>
                            <option value="2">Analista de Dados</option>
                        </select>

                        <div class="employee-action">
                            <button class="btn-next" id="nextButton" type="button">Próximo</button>
                        </div>
                    </div>

                    <div class="form-step" id="secondStep">
                        <fieldset class="access-group">
                            <legend>Informe os setores que o usuário terá acesso</legend>
                            <div class="selection-box">
                                <span class="selection-title">Setores</span>
                                <div class="selection-box" id="setoresSelectionBox">
                                    <label><input class="sector-checkbox" type="checkbox" name="sectors" value="vendas">
                                        Vendas</label>
                                    <label><input class="sector-checkbox" type="checkbox" name="sectors"
                                            value="financeiro">
                                        Financeiro</label>
                                    <label><input class="sector-checkbox" type="checkbox" name="sectors" value="loja">
                                        Merchat</label>
                                </div>
                            </div>
                            <label class="select-all">
                                Selecionar Tudo
                                <input id="selectAllSectorsid" type="checkbox" onchange="selectAllSectors()">
                            </label>
                        </fieldset>

                        <fieldset class="access-group">
                            <legend>Informe as máquinas que o usuário terá acesso</legend>
                            <div class="selection-box machines-box" id="maquinasSelectionBox">
                                <span class="selection-title">Máquinas</span>
                                <!-- TODO: Pegar pcs do bd -->
                                <div id="machineSelectionBox" class="selection-box machines">
                                    <span>Nenhuma Máquina Encontrada</span>
                                </div>
                            </div>
                            <label class="select-all">
                                Selecionar Tudo
                                <input id="selectAllMachinesid" type="checkbox" onchange="selectAllMachines()">
                            </label>
                        </fieldset>

                        <label class="terms-confirmation">
                            <input id="termsCheckbox" type="checkbox" required>
                            <span>Desejo Cadastrar esse Funcionário <a href="#">Termos de Serviço</a></span>
                        </label>

                        <p class="form-feedback" id="formFeedback" role="status" aria-live="polite"></p>

                        <div class="employee-action">
                            <button class="btn-next" type="submit">Finalizar</button>
                            <img class="loading-indicator" id="registerLoading" src="../assets/images/loading.gif"
                                alt="Cadastrando funcionário" hidden>
                        </div>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <script src="../scripts/api.js"></script>
    <script src="../scripts/cadastro-funcionario.js"></script>
</body>

</html>
