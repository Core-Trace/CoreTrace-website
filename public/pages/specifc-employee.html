<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Specific Employee</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/specific-employee.css">
</head>

<body>
    <main class="specific-content">


        <section class="info-section">
            <h2 class="section-title">Setores</h2>
            <div class="items-list" id="lista-setores">
            </div>
            <div class="items-list">
                <div class="list-item">
                    <button class="btn-remove">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M18 6L6 18M6 6l12 12"></path>
                        </svg>
                    </button>
                    <span class="item-text">Vendas</span>
                </div>
                <div class="list-item">
                    <button class="btn-remove">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M18 6L6 18M6 6l12 12"></path>
                        </svg>
                    </button>
                    <span class="item-text">Financeiro</span>
                </div>
                <div class="list-item">
                    <button class="btn-remove">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M18 6L6 18M6 6l12 12"></path>
                        </svg>
                    </button>
                    <span class="item-text">Loja</span>
                </div>
            </div>
        </section>

        <section class="info-section">
            <h2 class="section-title">Máquinas</h2>
            <div class="items-list" id="lista-maquinas">
            </div>
            <div class="items-list">
                <div class="list-item machine-item">
                    <div class="item-left">
                        <button class="btn-remove">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M18 6L6 18M6 6l12 12"></path>
                            </svg>
                        </button>
                        <span class="item-text">Máquina 1</span>
                    </div>
                    <span class="item-tag">Vendas</span>
                </div>
                <div class="list-item machine-item">
                    <div class="item-left">
                        <button class="btn-remove">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M18 6L6 18M6 6l12 12"></path>
                            </svg>
                        </button>
                        <span class="item-text">Máquina 2</span>
                    </div>
                    <span class="item-tag">Financeiro</span>
                </div>
            </div>
        </section>

        <div class="actions-footer">
            <button class="btn-save">Salvar</button>
        </div>



    </main>
</body>

</html>

<script>
    const ID_FUNCIONARIO_ATUAL = 1;

    window.onload = function () {
        carregarDadosDoFuncionario(ID_FUNCIONARIO_ATUAL);
    };

    async function carregarDadosDoFuncionario(idUsuario) {
        try {
            const response = await fetch("/employee/catchServer", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    employeeId: idUsuario
                })
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const dadosBanco = await response.json();

            renderizarListas(dadosBanco);

        } catch (error) {
            console.log("Erro ao Carregar Dados Específicos do Funcionário.", error);
        }
    }

    function renderizarListas(dados) {
        const containerSetores = document.getElementById("lista-setores");
        const containerMaquinas = document.getElementById("lista-maquinas");

        containerSetores.innerHTML = "";
        containerMaquinas.innerHTML = "";

        let setoresProcessados = [];
        let maquinasProcessadas = [];

        dados.forEach(item => {
            if (item.nome_setor && !setoresProcessados.includes(item.nome_setor)) {
                setoresProcessados.push(item.nome_setor);

                containerSetores.innerHTML += `
                    <div class="list-item" data-id-setor="${item.id_setor}">
                        <button class="btn-remove">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"></path></svg>
                        </button>
                        <span class="item-text">${item.nome_setor}</span>
                    </div>
                `;
            }

            if (item.codigo_maquina && !maquinasProcessadas.includes(item.id_maquina)) {
                maquinasProcessadas.push(item.id_maquina);

                const nomeExibicao = item.codigo_maquina || item.nome_maquina;

                containerMaquinas.innerHTML += `
                    <div class="list-item machine-item" data-id-maquina="${item.id_maquina}">
                        <div class="item-left">
                            <button class="btn-remove">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"></path></svg>
                            </button>
                            <span class="item-text">${nomeExibicao}</span>
                        </div>
                        <span class="item-tag">${item.nome_setor}</span>
                    </div>
                `;
            }
        });

    }

    document.addEventListener('click', function (event) {

        const botaoClicado = event.target.closest('.btn-remove');

        if (botaoClicado) {
            const linha = botaoClicado.closest('.list-item');

            if (linha) {
                linha.classList.toggle('desativado');

                const iconeX = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"></path></svg>`;
                const iconeMais = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"></path></svg>`;

                if (linha.classList.contains('desativado')) {
                    botaoClicado.innerHTML = iconeMais;
                } else {
                    botaoClicado.innerHTML = iconeX;
                }
            }
        }
    });

    document.getElementById('btn-salvar').addEventListener('click', async function () {
        const itensDesativados = document.querySelectorAll('.list-item.desativado');

        let maquinasParaRemover = [];

        itensDesativados.forEach(item => {
            if (item.hasAttribute('data-id-maquina')) {
                maquinasParaRemover.push(item.getAttribute('data-id-maquina'));
            }
        });

        if (maquinasParaRemover.length === 0) {
            alert("Nenhuma permissão foi alterada.");
            return;
        }

        try {
            const response = await fetch("/employee/revokeAccess", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    employeeId: ID_FUNCIONARIO_ATUAL,
                    maquinas: maquinasParaRemover
                })
            });

            if (response.ok) {
                alert("Permissões revogadas com sucesso!");
                window.location.reload();
            } else {
                alert("Erro ao salvar as alterações.");
            }
        } catch (error) {
            console.error("Erro ao salvar:", error);
        }
    });

</script>
