<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de usuário - Teste</title>
</head>
<body>
    <h1>Cadastro de usuário</h1>
    <p>O usuário receberá um email para definir a senha e ativar a conta.</p>

    <form id="cadastroForm">
        <p>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" maxlength="45" required>
        </p>
        <p>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" maxlength="45" required>
        </p>
        <p>
            <label for="cpf">CPF (opcional, somente números):</label>
            <input type="text" id="cpf" name="cpf" inputmode="numeric" pattern="[0-9]{11}" maxlength="11">
        </p>
        <p>
            <label for="telefone">Telefone (opcional):</label>
            <input type="tel" id="telefone" name="telefone" maxlength="45">
        </p>
        <p>
            <label for="empresa">ID da empresa:</label>
            <input type="number" id="empresa" name="empresa" min="1" step="1" required>
        </p>
        <p>
            <label for="nivelAcesso">ID do nível de acesso:</label>
            <input type="number" id="nivelAcesso" name="nivelAcesso" min="1" step="1" required>
        </p>
        <p>A empresa e o nível de acesso precisam existir no banco.</p>
        <button type="submit" id="cadastrarButton">Cadastrar e enviar convite</button>
    </form>

    <p id="mensagem" role="status" aria-live="polite"></p>
    <a href="/pages/login.html">Ir para o login</a>

    <script src="../scripts/cadastro-teste.js"></script>
</body>
</html>
