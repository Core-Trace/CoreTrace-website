<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/main.css">
</head>

<body>
    <header class="navbar">
            <div class="navbar-left">
                <div class="burgerButton" onclick="asidePlot()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60" fill="none">
                        <path fill-rule="evenodd" clip-rule="evenodd"
                            d="M7.5 40H52.5V45H7.5V40ZM7.5 27.5H52.5V32.5H7.5V27.5ZM7.5 15H52.5V20H7.5V15Z"
                            fill="#F6ECE6" />
                    </svg>
                </div>
                <canvas class="navbar-logo">
            </div>

            <nav class="navbar-right">
                <button class="theme-toggle">
                    <img src="../assets/icons/Mingcute Sun Fill.png">
                </button>
                <a href="#" class="nav-link active">Home</a>
                <a href="#" class="nav-link">Equipe</a>
                <a href="#footer" class="nav-link">Links Úteis</a>
                <a href="/pages/login.html" class="nav-link">Login</a>
            </nav>
        </header>

    <div class="login">
        <div class="login-card">
            <h1 class="titulo">Login</h1>

            <div class="steps">
                <div class="dot active"></div>
                <div class="step-line active"></div>
                <div class="dot active" id="secondDot"></div>
            </div>

            <form class="login-form" id="loginForm" novalidate>
                <input type="text" class="input" id="emailInput" placeholder="Insira uma Passkey" required>

                <label class="termos">
                    <input type="checkbox" id="termosCheckbox" required>
                    Concordo com os <a href="#" class="link">Termos de Serviço</a>
                </label>

                <p class="contato">Entre em <a href="#" class="link">Contato</a></p>

                <p class="form-feedback" id="loginFeedback" role="status" aria-live="polite"></p>
                <button type="submit" class="btn-next">Finalizar</button>
            </form>
        </div>
    </div>


</body>

</html>
